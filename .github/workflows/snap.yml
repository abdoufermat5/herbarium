name: Snap

# Packages the .deb published in an existing GitHub release as a snap and, when
# credentials are configured, uploads it to the Snap Store.
#
# release.yml calls this after publishing a release. It can also be dispatched
# by hand to package an already-released version:
#
#   gh workflow run snap.yml -f tag=v0.2.0
#
# Publishing needs the SNAPCRAFT_STORE_CREDENTIALS secret. Without it the snap
# is still built and kept as a workflow artifact, and the publish step leaves a
# ::notice:: in the run summary. See docs/distribution.md.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to package (e.g. v0.2.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build snap (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # amd64 only. The amd64 .deb is built on ubuntu-22.04, whose glibc
        # (2.35) matches the core22 snap base; the arm64 .deb is built on
        # ubuntu-24.04 and needs glibc 2.39, which core22 does not provide.
        # Add an arm64 leg only once the arm64 .deb comes from a 22.04 runner.
        include:
          - arch: amd64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download the release .deb
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p desktop/packaging/snap
          gh release download "$TAG" \
            --dir desktop/packaging/snap \
            --pattern "herbarium_*_${ARCH}.deb"
          shopt -s nullglob
          debs=(desktop/packaging/snap/herbarium_*_"${ARCH}".deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one ${ARCH} .deb in release $TAG, found ${#debs[@]}"
            exit 1
          fi
          # The part's source is a fixed name so snapcraft.yaml stays static.
          mv "${debs[0]}" desktop/packaging/snap/herbarium.deb
          ls -l desktop/packaging/snap/herbarium.deb
          # The store listing icon (snapcraft.yaml `icon:`) must sit inside the
          # snap project directory.
          cp desktop/icons/icon.png desktop/packaging/snap/herbarium.png

      # The packaging manifest carries a __VERSION__ token because snapcraft has
      # no CLI override for the project version. The tag is validated before it
      # reaches sed (tags are user input on workflow_dispatch).
      - name: Inject the version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "::error::invalid release tag: $TAG"
              exit 1
              ;;
          esac
          sed -i "s|__VERSION__|${version}|g" desktop/packaging/snap/snapcraft.yaml
          if grep -q '__VERSION__' desktop/packaging/snap/snapcraft.yaml; then
            echo "::error::the __VERSION__ token was not replaced"
            exit 1
          fi
          grep '^version:' desktop/packaging/snap/snapcraft.yaml

      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: desktop/packaging/snap

      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  publish:
    name: Publish to the Snap Store
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      # A job-level `if:` cannot read `secrets`, so resolve the boolean here.
      # Secrets are only compared, never printed.
      - name: Resolve store credentials
        id: creds
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SNAPCRAFT_STORE_CREDENTIALS is not set; the snap was built but not published. Set the secret to publish (see docs/distribution.md)."
          fi

      # Plain versions go to `stable`, prereleases (a '-' in the version) to
      # `candidate`.
      - name: Resolve release channel
        id: channel
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "${TAG#v}" in
            *-*) echo "channel=candidate" >> "$GITHUB_OUTPUT" ;;
            *) echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          name: snap-amd64
          path: snap

      - name: Locate the snap artifact
        id: file
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          file="$(find snap -name '*.snap' -print -quit)"
          if [ -z "$file" ]; then
            echo "::error::no .snap artifact found"
            exit 1
          fi
          echo "snap=$file" >> "$GITHUB_OUTPUT"

      - uses: snapcore/action-publish@v1
        if: steps.creds.outputs.configured == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.file.outputs.snap }}
          release: ${{ steps.channel.outputs.channel }}
