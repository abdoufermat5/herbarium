name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Check & Deb Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Bundle size budget
        run: node scripts/bundle-budget.mjs
      - run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path desktop/Cargo.toml --workspace
      - name: Build Linux deb bundle
        # Checks that bundling works; the size-optimised release profile
        # (one codegen unit, LTO) is left to releases, it takes much longer.
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: pnpm tauri build --bundles deb

  perf:
    name: Performance (N=1000)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: perf

      # Builds a synthetic 1000-page vault on first use (about a minute), then
      # times the core operations through Host::call.
      - name: Run the vault benchmarks
        run: >
          cargo bench --manifest-path desktop/Cargo.toml -p herbarium-core --bench vault
          -- --warm-up-time 1 --measurement-time 3
        env:
          HERB_BENCH_N: "1000"
          HERB_BENCH_DIR: ${{ runner.temp }}/bench-vaults
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
      - name: Compare with docs/perf-baseline.json (fails on >25% regression)
        run: node scripts/perf-check.mjs
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion
          path: desktop/target/criterion
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: e2e

      - name: Install Linux dependencies and drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            webkit2gtk-driver xvfb
          cargo install tauri-driver --locked

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the e2e suites (CLI, native host, extension, publish, remix, desktop app)
        run: pnpm test:e2e
        env:
          E2E_SCREENSHOTS: ${{ runner.temp }}/e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-screenshots
          if-no-files-found: ignore

  compile:
    name: Compile (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compile Tauri app
        run: |
          cargo check --manifest-path desktop/Cargo.toml --workspace --all-targets
          cargo build --manifest-path desktop/Cargo.toml --workspace
