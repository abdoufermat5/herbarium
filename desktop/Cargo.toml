[workspace]
members = ["crates/herbarium-core", "crates/herbarium-mcp"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
herbarium-core = { path = "crates/herbarium-core" }
herbarium-mcp = { path = "crates/herbarium-mcp" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[package]
name = "herbarium"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "herbarium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
dirs = "7.0.0"
herbarium-core.workspace = true
herbarium-mcp.workspace = true
parking_lot = "0.12"
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
zip = { version = "3.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# What ships: one optimisation unit with link-time optimisation and no debug
# symbols, so the binary is about half the size. Panics still unwind, so a
# bug in one command fails that command instead of closing the app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Keep the binary size-optimised overall, but spend the compile on the crates
# that dominate the hot paths (HTML parsing, SQLite, JSON, the core kernel).
[profile.release.package.html5ever]
opt-level = 3

[profile.release.package.markup5ever]
opt-level = 3

[profile.release.package.scraper]
opt-level = 3

[profile.release.package.rusqlite]
opt-level = 3

[profile.release.package.libsqlite3-sys]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.herbarium-core]
opt-level = 3
